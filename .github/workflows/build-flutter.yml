name: Build Flutter APK & Windows EXE

on:
  # Click "Run workflow" manually anytime on GitHub Actions
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (--dart-define=API_URL)'
        required: false
        default: 'https://workspace-campus-api.onrender.com/api'
        type: string
  # Also auto-builds when you push a version tag like v1.0.0
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Build Android .APK & Play .AAB (Fast Linux VM)
  # ==========================================
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 🛠️ Setup Flutter Workspace
        uses: ./.github/actions/setup-flutter

      - name: 🔐 Configure Release Keystore (if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release keystore configured."
          else
            echo "::warning::Signing secrets missing (KEYSTORE_BASE64/PASSWORD/ALIAS). Falling back to debug signing."
          fi

      - name: 📱 Build Signed & Obfuscated Release APK
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            --dart-define=API_URL=${{ inputs.api_url || 'https://workspace-campus-api.onrender.com/api' }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: 📦 Build Signed & Obfuscated Play App Bundle (.aab)
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            --dart-define=API_URL=${{ inputs.api_url || 'https://workspace-campus-api.onrender.com/api' }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: 🧹 Clean Up Keystore Files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: 📤 Upload Android APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Northstar-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: 📤 Upload Play Store App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Northstar-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: 📤 Upload Android Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: Northstar-Android-Symbols
          path: build/app/outputs/symbols/
          retention-days: 30

  # ==========================================
  # JOB 2: Build Windows .EXE (Fast Windows VM)
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter Workspace
        uses: ./.github/actions/setup-flutter

      - name: 🖥️ Build Windows Release EXE
        shell: pwsh
        run: |
          flutter build windows --release `
            --obfuscate --split-debug-info=build/windows/symbols `
            --dart-define=API_URL=${{ inputs.api_url || 'https://workspace-campus-api.onrender.com/api' }} `
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: 🗜️ Zip Windows Release Folder (keeps .exe + required .dll files together)
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Northstar-Windows.zip" -Force

      - name: 📤 Upload Windows App for Download
        uses: actions/upload-artifact@v4
        with:
          name: Northstar-Windows-EXE
          path: Northstar-Windows.zip
          retention-days: 7
