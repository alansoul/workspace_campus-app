name: Release Mobile APK & Desktop EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze & Test Before Release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter Workspace
        uses: ./.github/actions/setup-flutter

      - name: 🔍 Run Static Analyzer
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Unit & Widget Tests
        run: flutter test

  build-android-release:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 🛠️ Setup Flutter Workspace
        uses: ./.github/actions/setup-flutter

      - name: 📱 Build Android APK
        run: flutter build apk --release

      - name: 📤 Stage APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-windows-release:
    name: Build Windows Desktop Bundle
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter Workspace
        uses: ./.github/actions/setup-flutter

      - name: 🖥️ Build Windows Release EXE
        run: flutter build windows --release

      - name: 🗜️ Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\campus_mobile-windows-x64.zip" -Force

      - name: 📤 Stage Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-zip
          path: dist/campus_mobile-windows-x64.zip
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-android-release, build-windows-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: release-android-apk
          path: release-assets

      - name: 📥 Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: release-windows-zip
          path: release-assets

      - name: 🏷️ Rename APK for Release
        run: mv release-assets/app-release.apk release-assets/campus_mobile-android.apk

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/campus_mobile-android.apk
            release-assets/campus_mobile-windows-x64.zip
